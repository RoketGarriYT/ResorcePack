
name: Build X_XSquad EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "X_XSquad.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: python -m pip install PyQt6 pyinstaller

      - name: Build Windows EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name X_XSquad X_XSquad.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: X_XSquad-Windows
          path: dist/X_XSquad.exe
          if-no-files-found: error
